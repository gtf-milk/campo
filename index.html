<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-700-normal.woff2) format("woff2")}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,#21402F,#13251A 60%,#0F2116);color:var(--on-brand);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gate-in{max-width:420px;margin:0 auto;padding-block:40px 32px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.gate h1{font-size:34px;font-weight:700}
.gate .sub{margin:4px 0 0;color:var(--on-brand-2)}
.gate p{margin:0}
.gate .field > label{color:var(--on-brand)}
.gate .inp{background:var(--surface);color:var(--ink);border-color:transparent}
.gate .note{color:var(--on-brand-2)}
.gate .note b{color:var(--on-brand)}
.gate .link{color:var(--gold-2);justify-self:start;font-size:15px}
.gate .btn.pri{background:var(--gold);color:var(--on-gold)}
.gate .selsum{background:rgb(255 255 255 / .12);color:var(--on-brand)}
.gate-note{padding:14px;border-radius:12px;background:rgb(255 255 255 / .08)}
.mark.big{width:64px;height:64px;font-size:20px;border-radius:18px}

.gate-in{position:relative}
.gate .eyb{margin:0 0 6px;font-family:var(--f-head);font-weight:600;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-2)}
.gate h1{font-size:40px;line-height:1}

/* abertura: foto da bezerra holandesa no topo, desbotando no verde */
.photo-top{position:relative;margin-top:calc(-40px - env(safe-area-inset-top,0px));margin-inline:calc(-1 * max(24px,env(safe-area-inset-left,0px))) calc(-1 * max(24px,env(safe-area-inset-right,0px)));height:calc(46vh + env(safe-area-inset-top,0px));min-height:300px;max-height:520px}
.ph-img{position:absolute;inset:0;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.ph-img img{width:100%;height:100%;object-fit:cover;object-position:30% 40%;display:block}
.ph-img::after{content:"";position:absolute;inset:0;background:linear-gradient(rgb(12 28 18 / 0) 42%,rgb(12 28 18 / .72) 90%)}
.photo-top .ph-ttl h1{font-size:clamp(30px,10.2vw,40px)}
.photo-top .ph-ttl{position:absolute;left:max(24px,env(safe-area-inset-left,0px));right:max(24px,env(safe-area-inset-right,0px));bottom:4px}
.gate h1{text-shadow:0 2px 14px rgb(0 0 0 / .35)}
.gate .eyb{text-shadow:0 1px 8px rgb(0 0 0 / .55)}

/* engrenagem do topo (Admin / Conta) e lotes */
.hbtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:rgb(255 255 255 / .10);color:var(--on-brand);font-family:var(--f-head);font-weight:600;font-size:14px;flex:none}
.hbtn .ic{width:18px;height:18px}
.hbtn[aria-current="page"]{background:var(--gold);color:var(--on-gold)}
@media (max-width:419px){.hbtn{padding:0;width:36px;justify-content:center}.hbtn span{display:none}.top .mark{display:none}}
.ricon.lote,.ricon.pesagem{background:var(--gado-bg);color:var(--gado)}
.card.lote .card-h h3{font-size:20px}
.card.lote .facts{margin-bottom:2px}
.card.lote .row2{grid-template-columns:auto minmax(0,1fr)}
.card.lote .row2 .btn{white-space:nowrap}
@media (max-width:359px){.card.lote .row2 .btn{white-space:normal}}

/* pastagem | lavouras no mapa */
.maptabs{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:2px;padding:3px;border-radius:999px;background:rgb(19 37 26 / .88);z-index:2}
.maptabs button{height:36px;padding:0 16px;border-radius:999px;color:#fff;font-family:var(--f-head);font-weight:600;font-size:15px}
.maptabs button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.mapwrap:has(.maptabs) .legend{top:58px}
.map[data-tab="pastagem"] .u.lav,.map[data-tab="lavoura"] .u.pas{pointer-events:none}
.map[data-tab="pastagem"] .u.lav .uf,.map[data-tab="lavoura"] .u.pas .uf{fill-opacity:0}
.map[data-tab="pastagem"] .u.lav .uh,.map[data-tab="lavoura"] .u.pas .uh{display:none}
.map[data-tab="pastagem"] .u.lav .us,.map[data-tab="lavoura"] .u.pas .us{stroke-opacity:.4;stroke-width:1;stroke-dasharray:4 3}
.map[data-tab="pastagem"] .dl{opacity:.3}
.map[data-tab="lavoura"] .cor,.map[data-tab="lavoura"] .pl .pt{opacity:.3}
.map .dl,.gpsl{pointer-events:none}
.lb.plant rect{fill:#E3B21C;fill-opacity:1}
.lb.plant text{fill:#2B2100}
.gacc{fill:#4DABF7;fill-opacity:.18;stroke:#4DABF7;stroke-opacity:.7;stroke-width:1;vector-effect:non-scaling-stroke}
.gh{fill:#fff}
.gd{fill:#1C7ED6}
.zoom button[aria-pressed="true"]{background:#1C7ED6;color:#fff}
.ucode{width:auto;min-width:46px;padding:0 6px}
.segrow{display:grid;gap:8px}
@media (min-width:560px){.segrow{grid-template-columns:1fr 1fr}}
.tabseg{margin-block:2px}
.north{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:216px;width:44px;height:52px;border-radius:12px;background:rgb(19 37 26 / .85);display:grid;place-items:center;align-content:center;gap:0;pointer-events:none}
.north svg{width:24px;height:24px}
.north b{color:#fff;font-family:var(--f-head);font-size:12px;line-height:1}


/* Layout: one-screen field app. Green header band, a working area (satellite map or list), and a bottom bar with a raised gold Registrar button. Big targets for use in the sun. */
:root{
  --bg:#EEF2EB; --surface:#FFFFFF; --surface-2:#E3E9DF; --ink:#13251A; --ink-2:#4F6055; --line:#CFD8CA;
  --brand:#1E3A2B; --brand-2:#2C5340; --on-brand:#F3F7F1; --on-brand-2:#B9CDBF;
  --gold:#C9A227; --gold-2:#E7C454; --on-gold:#1F2610; --tint:#E6EFD9;
  --danger:#B93A0B; --danger-bg:#FBE4D6; --warn:#8A5A00; --warn-bg:#FBEFCF; --ok:#25743A; --ok-bg:#DCF0DF;
  --trat:#6D3FA8; --trat-bg:#EDE3F7;
  --gado:#2457B8; --gado-bg:#DDE7FA; --plant:#8A6A00; --plant-bg:#F6EBC4; --rest:#25743A; --rest-bg:#DCF0DF; --none-bg:#E8ECE5;
  --map-bg:#1C2A21;
  --shadow:0 1px 2px rgb(19 37 26 / .10), 0 6px 18px rgb(19 37 26 / .10);
  --f-body:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-head:"Barlow Semi Condensed", "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1611; --surface:#15221A; --surface-2:#1D2D23; --ink:#E5EEE6; --ink-2:#A2B4A8; --line:#2A3C31;
    --brand:#112319; --brand-2:#1E3A2B; --on-brand:#EEF4EF; --on-brand-2:#9DB5A6;
    --gold:#D6B03A; --gold-2:#E9C960; --on-gold:#1A200C; --tint:#22331F;
    --danger:#FF9466; --danger-bg:#3A1D10; --warn:#F2C25C; --warn-bg:#352A0E; --ok:#7BD08E; --ok-bg:#163020;
    --trat:#C9A6F2; --trat-bg:#2B1F3D;
    --trat:#C9A6F2; --trat-bg:#2B1F3D;
  --gado:#8DB3FF; --gado-bg:#18284A; --plant:#F0CE5A; --plant-bg:#342C0E; --rest:#7BD08E; --rest-bg:#163020; --none-bg:#1F2B23;
    --map-bg:#0B130E; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 6px 18px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1611; --surface:#15221A; --surface-2:#1D2D23; --ink:#E5EEE6; --ink-2:#A2B4A8; --line:#2A3C31;
  --brand:#112319; --brand-2:#1E3A2B; --on-brand:#EEF4EF; --on-brand-2:#9DB5A6;
  --gold:#D6B03A; --gold-2:#E9C960; --on-gold:#1A200C; --tint:#22331F;
  --danger:#FF9466; --danger-bg:#3A1D10; --warn:#F2C25C; --warn-bg:#352A0E; --ok:#7BD08E; --ok-bg:#163020;
  --trat:#C9A6F2; --trat-bg:#2B1F3D;
  --gado:#8DB3FF; --gado-bg:#18284A; --plant:#F0CE5A; --plant-bg:#342C0E; --rest:#7BD08E; --rest-bg:#163020; --none-bg:#1F2B23;
  --map-bg:#0B130E; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 6px 18px rgb(0 0 0 / .35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
body::after{content:"";position:fixed;inset:auto 0 0;height:env(safe-area-inset-bottom,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ic{width:22px;height:22px;flex:none}
.ic.sm{width:18px;height:18px}
.ic.lg{width:30px;height:30px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.1}

.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);min-height:0}
.top{background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:13px;letter-spacing:.04em;flex:none}
.ttl{min-width:0;flex:1}
.ttl h1{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl h1{font-size:clamp(18px,5vw,22px)}
@media (max-width:420px){.wide{display:none}}
.ttl p{margin:0;font-size:13px;color:var(--on-brand-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:rgb(255 255 255 / .10);color:var(--on-brand);font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#7BD08E}
.sync.wait .dot{background:var(--gold-2)}
.sync.off .dot{background:#FF9466}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.banner{display:flex;align-items:center;gap:10px;font-size:14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line)}
.banner p{margin:0;flex:1;min-width:0}
.banner button{font-weight:700;text-decoration:underline;color:inherit;padding:6px 0;white-space:nowrap}

main{position:relative;min-height:0;overflow:hidden}
#v-mapa{position:absolute;inset:0;background:var(--map-bg)}
#v-list{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pagew{max-width:760px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}

/* bottom bar */
.bar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:var(--surface);border-top:1px solid var(--line);padding-top:4px;padding-bottom:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));position:relative;z-index:5}
.nb{display:grid;justify-items:center;gap:2px;padding:6px 2px;min-width:0;font-family:var(--f-head);font-size:13px;font-weight:600;color:var(--ink-2);min-height:52px}
.nb > span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb[aria-current="page"]{color:var(--ink)}
.nb[aria-current="page"] .ic{color:var(--ok)}
.nb.reg .plus{width:58px;height:58px;border-radius:18px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;margin-top:-26px;box-shadow:var(--shadow);border:3px solid var(--surface)}
.nb.reg .plus .ic{width:30px;height:30px;stroke-width:2.6}
.nb.reg{color:var(--ink)}
.nb:disabled{opacity:.45;cursor:not-allowed}

/* map */
.mapwrap{position:absolute;inset:0}
svg.map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--map-bg);cursor:grab}
svg.map:active{cursor:grabbing}
.u{cursor:pointer}
.uf{transition:fill .2s,fill-opacity .2s}
.us{fill:none;stroke:#fff;stroke-width:1.6;stroke-opacity:.9}
.u.sel .us{stroke:#FFD43B;stroke-width:3.4;stroke-opacity:1}
.lb rect{fill:#13251A;fill-opacity:.82}
.lb text{fill:#fff;font-family:var(--f-head);font-weight:700;font-size:13px;dominant-baseline:central;text-anchor:middle}
.lb.sel rect{fill:#FFD43B;fill-opacity:1}
.lb.sel text{fill:#1A200C}
.legend{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(64px,calc(env(safe-area-inset-right,0px) + 64px));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.legend::-webkit-scrollbar{display:none}
.lgd{display:flex;align-items:center;gap:6px;background:rgb(19 37 26 / .82);color:#fff;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;white-space:nowrap}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid #fff;flex:none}
.zoom{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));display:grid;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;background:rgb(19 37 26 / .85);color:#fff;display:grid;place-items:center}
.attr{position:absolute;left:max(8px,env(safe-area-inset-left,0px));bottom:6px;font-size:11px;color:#fff;opacity:.75;text-shadow:0 1px 2px #000;pointer-events:none}
.mapcard{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:12px;max-width:520px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px;display:grid;gap:10px}
.mc-h{display:flex;align-items:flex-start;gap:10px}
.mc-h > div{flex:1;min-width:0}
.mc-t{font-family:var(--f-head);font-weight:700;font-size:22px}
.mc-s{color:var(--ink-2);font-size:14px}
.xbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface-2);flex:none}
.mc-last{font-size:14px;color:var(--ink-2)}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row3 .btn{font-size:15px;padding:8px 6px;min-height:48px}
.ov-f.three .btn{font-size:16px;padding:10px 6px}
.ucode.car{background:var(--danger-bg);color:var(--danger)}
.ucode.pend{background:var(--warn-bg);color:var(--warn)}
.ricon.avaliacao{background:var(--rest-bg);color:var(--rest)}
.lb.ready rect{fill:#2F9E44;fill-opacity:1;stroke:none}
.lb.occ.hot rect{fill:#E8590C}

/* chips & buttons */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--none-bg);color:var(--ink-2);white-space:nowrap}
.chip.gado{background:var(--gado-bg);color:var(--gado)}
.chip.descanso{background:var(--rest-bg);color:var(--rest)}
.chip.plantado{background:var(--plant-bg);color:var(--plant)}
.chip.colhido{background:var(--surface-2);color:var(--ink-2)}
.chip.car{background:var(--danger-bg);color:var(--danger)}
.chip.pend{background:var(--warn-bg);color:var(--warn)}
.chip.demo{background:var(--surface-2);color:var(--ink-2);border:1px dashed var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 16px;border-radius:12px;font-family:var(--f-head);font-weight:700;font-size:17px;background:var(--surface-2);color:var(--ink)}
.btn.pri{background:var(--brand-2);color:var(--on-brand)}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:40px;font-size:15px;padding:6px 12px}
.link{color:var(--ok);font-weight:700;font-size:14px;padding:6px 0}

/* cards / lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.card-h h3{font-size:19px;flex:1;min-width:0}
.card-h .meta{font-size:14px;color:var(--ink-2);white-space:nowrap}
.card-b{padding:0 16px 16px;display:grid;gap:12px}
.eyebrow{font-family:var(--f-head);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.pg-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pg-h > div{flex:1;min-width:0}
.pg-h h2{font-size:28px}
.pg-h p{margin:2px 0 0;color:var(--ink-2)}
.urow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-top:1px solid var(--line);min-height:62px}
.urow:first-child{border-top:0}
.ucode{width:46px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:17px;background:var(--surface-2);flex:none;position:relative}
.ucode.gado{background:var(--gado-bg);color:var(--gado)}
.ucode.descanso{background:var(--rest-bg);color:var(--rest)}
.ucode.plantado{background:var(--plant-bg);color:var(--plant)}
.ucode .flag{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.uinfo{flex:1;min-width:0}
.uinfo b{font-weight:600;display:block}
.uinfo span{font-size:14px;color:var(--ink-2)}
.uha{font-size:14px;color:var(--ink-2);white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:50px}
.search input{border:0;background:transparent;flex:1;min-width:0;font-size:17px;outline:none;padding:10px 0}
.placeholder{border:2px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:flex-start;color:var(--ink-2)}
.placeholder b{color:var(--ink);display:block;font-family:var(--f-head);font-size:18px}
.placeholder p{margin:4px 0 0}

/* records */
.day{font-family:var(--f-head);font-weight:700;font-size:15px;color:var(--ink-2);padding:6px 2px 0;letter-spacing:.02em}
.rec{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.rec:first-child{border-top:0}
.ricon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink)}
.ricon.aplicacao{background:var(--danger-bg);color:var(--danger)}
.ricon.plantio,.ricon.colheita{background:var(--plant-bg);color:var(--plant)}
.ricon.adubacao{background:var(--rest-bg);color:var(--rest)}
.ricon.gado_entrou,.ricon.gado_saiu{background:var(--gado-bg);color:var(--gado)}
.ricon.ocorrencia{background:var(--warn-bg);color:var(--warn)}
.ricon.mudanca{background:var(--gado-bg);color:var(--gado)}
.ricon.tratamento{background:var(--trat-bg);color:var(--trat)}
.lb.occ rect{fill:#2F6FDB;fill-opacity:1}
.lb.rest rect{stroke:#5BC26B;stroke-width:1.5}
.lb.sel rect{fill:#FFD43B;fill-opacity:1;stroke:none}
.lb.sel text{fill:#1A200C}
.rot{gap:0;padding:4px 14px}
.rot-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.rot-row:first-child{border-top:0}
.occ-box{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--gado-bg);color:var(--gado)}
.occ-box b{display:block;font-size:17px}
.occ-box span{font-size:14px}
.kvrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.dest{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-top:1px solid var(--line);min-height:62px}
.dest:first-of-type{border-top:0}
.dest[aria-pressed="true"]{background:var(--tint);box-shadow:inset 4px 0 0 var(--ok)}
.dest[data-block]{opacity:.7}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--brand-2);color:var(--on-brand);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;max-width:calc(100% - 32px);width:max-content}
#flow{z-index:45}
.rbody{flex:1;min-width:0;display:grid;gap:3px}
.rt{font-weight:700;font-size:17px}
.rl{font-size:15px;overflow-wrap:anywhere}
.rl.car{color:var(--danger);font-weight:600}
.rm{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.rx{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.filters::-webkit-scrollbar{display:none}
.fbtn{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap;min-height:40px}
.fbtn[aria-pressed="true"]{background:var(--brand-2);border-color:var(--brand-2);color:var(--on-brand)}
.empty{text-align:center;padding:28px 16px;display:grid;gap:10px;justify-items:center;color:var(--ink-2)}
.empty b{font-family:var(--f-head);font-size:20px;color:var(--ink)}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-h{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-h > div{flex:1;min-width:0}
.ov-h h2{font-size:24px}
.ov-k{font-size:13px;color:var(--ink-2);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface)}
.steps i{height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--gold)}
.ov-b{overflow:auto;min-height:0}
.ov-f{display:flex;gap:10px;background:var(--surface);border-top:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-f .btn{flex:1}
.ov-f .btn.back{flex:0 0 auto}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:8px;align-content:center;justify-items:start;text-align:left;min-height:104px;padding:14px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);font-family:var(--f-head);font-weight:700;font-size:19px;line-height:1.1}
.tile small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--ink-2)}
.tile[aria-pressed="true"]{border-color:var(--ok);background:var(--tint)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:42px;border-radius:9px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.selsum{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--tint);font-weight:600}
.selsum span{flex:1}
.ck{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);min-height:58px;cursor:pointer}
.ck:first-of-type{border-top:0}
.ck input{width:26px;height:26px;accent-color:var(--brand-2);flex:none}
.flowmap{position:relative;height:min(58vh,520px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.field{display:grid;gap:6px}
.field > label, .lbl{font-weight:600;font-size:15px}
.field .hint{font-size:13px;color:var(--ink-2)}
.inp{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:17px}
textarea.inp{min-height:84px;resize:vertical}
.inrow{display:flex;gap:8px;align-items:stretch}
.inrow .inp{flex:1;min-width:0}
.unit{display:grid;place-items:center;padding:0 12px;border-radius:12px;background:var(--surface-2);font-weight:700;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prow{display:grid;gap:10px;padding:14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface)}
.prow-h{display:flex;align-items:center;gap:8px}
.prow-h .lbl{flex:1}
.total{font-size:14px;color:var(--ink-2)}
.newp{display:grid;gap:10px;padding:12px;border-radius:12px;background:var(--surface-2)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pk{min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.pk[aria-pressed="true"]{border-color:var(--ok);background:var(--tint)}
.sum{display:grid;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.sum .rt{font-size:20px;font-family:var(--f-head)}
.done{display:grid;gap:16px;justify-items:center;text-align:center;padding:32px 8px}
.done .big{width:84px;height:84px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.done .big .ic{width:44px;height:44px;stroke-width:2.6}
.done h2{font-size:30px}
.done p{margin:0;max-width:36ch;color:var(--ink-2)}
.alert{display:flex;gap:10px;text-align:left;padding:14px;border-radius:12px;background:var(--danger-bg);color:var(--danger);font-weight:600}
.mini{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%;border-radius:var(--r);background:var(--map-bg)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.fact .k{font-size:13px;color:var(--ink-2);font-weight:600}
.fact .v{font-family:var(--f-head);font-weight:700;font-size:19px;overflow-wrap:anywhere}
.fact .s{font-size:13px;color:var(--ink-2)}
.fact.car{background:var(--danger-bg);border-color:transparent}
.fact.car .v,.fact.car .k{color:var(--danger)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.kv span:first-child{color:var(--ink-2)}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer}
.toggle input{width:24px;height:24px;accent-color:var(--brand-2)}
.note{font-size:14px;color:var(--ink-2);margin:0}
@media (min-width:640px){ .tiles{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (prefers-reduced-motion: reduce){ .spin{animation:none} .uf{transition:none} }
